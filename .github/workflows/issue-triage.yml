name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze issue and draft plan
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (título: "${{ github.event.issue.title }}").

            Lee el cuerpo del issue y el contexto del proyecto (CLAUDE.md) y publica un ÚNICO comentario en el issue, en Markdown puro, con esta estructura exacta:

            ## Resumen reformateado
            (El issue reescrito de forma clara y estructurada, preservando la intención original del autor)

            ## Análisis de viabilidad
            (¿Es técnicamente viable dado el estado actual del código? ¿Hay ambigüedades, dependencias externas, o riesgos?)

            ## Validez
            (¿El issue es un bug, feature, duda o no aplica al proyecto? ¿Está bien definido o falta información clave?)

            ## Plan de trabajo propuesto (pendiente de aprobación)
            (Lista numerada de pasos concretos para implementarlo, incluyendo archivos afectados si se pueden inferir. Deja explícito que este plan requiere aprobación humana antes de ejecutarse.)

            No implementes nada, no crees ramas ni PRs. Solo publica el comentario de análisis.
